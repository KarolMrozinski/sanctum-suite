name: SANCTUM AI Resilience & Compliance Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sanctum-audit:
    name: Execute SANCTUM Resilience Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & SANCTUM-SUITE
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Test Suite
        run: |
          pytest

      - name: Execute SANCTUM Compliance & Resilience Audit Gate
        env:
          SANCTUM_LICENSE_KEY: ${{ secrets.SANCTUM_LICENSE_KEY }}
        run: |
          sanctum run-audit --target "127.0.0.1"