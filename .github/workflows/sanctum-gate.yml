name: SANCTUM AI Resilience & Compliance Gate

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: "Target domain you are explicitly authorized to test"
        required: true
        type: string
      authorization:
        description: "Type I_HAVE_AUTHORIZATION to confirm written permission for this target"
        required: true
        type: string

jobs:
  sanctum-audit:
    name: Execute SANCTUM Resilience Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify target authorization
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          if [ "$AUTHORIZATION" != "I_HAVE_AUTHORIZATION" ]; then
            echo "Explicit authorization confirmation is required."
            exit 1
          fi

      - name: Install Dependencies & SANCTUM-SUITE
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Test Suite
        run: |
          pytest

      - name: Execute authorized SANCTUM audit
        env:
          TARGET_DOMAIN: ${{ inputs.target_domain }}
        run: |
          sanctum run-audit --target "$TARGET_DOMAIN"