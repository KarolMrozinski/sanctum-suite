name: SANCTUM-SUITE CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Open Policy Agent
      uses: open-policy-agent/setup-opa@v2
      with:
        version: 1.21.2

    - name: Test Rego authorization policy
      run: opa test policies/sanctum/api -v

    - name: Set up Java for TLA+
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Check authorization and audit TLA+ model
      env:
        TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      run: |
        curl --fail --silent --show-error --location \
          https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
          --output "$RUNNER_TEMP/tla2tools.jar"
        echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check -
        java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC \
          -config formal/authorization-audit/AuthorizationAudit.cfg \
          formal/authorization-audit/AuthorizationAudit.tla

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run Pytest Suite
      run: python -m pytest -q

    - name: Build Python distributions
      run: |
        python -m pip install build
        python -m build

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: sanctum-dashboard/package-lock.json

    - name: Install audit ZK dependencies
      working-directory: tools/zk-audit
      run: npm ci

    - name: Compile production audit circuit
      working-directory: tools/zk-audit
      run: npm run compile

    - name: Compile and smoke-test audit Groth16 circuit
      working-directory: tools/zk-audit
      run: npm test

    - name: Install dashboard dependencies
      working-directory: sanctum-dashboard
      run: npm ci

    - name: Lint dashboard
      working-directory: sanctum-dashboard
      run: npm run lint

    - name: Build dashboard
      working-directory: sanctum-dashboard
      run: npm run build