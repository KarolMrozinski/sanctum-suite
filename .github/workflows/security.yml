name: SANCTUM-SUITE Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . bandit pip-audit
      - name: Run Bandit
        run: |
          bandit_status=0
          audit_status=0
          bandit --recursive src/sanctum_suite --exclude src/sanctum_suite/tests --severity-level medium --confidence-level medium --format json --output bandit-report.json || bandit_status=$?
          python -m pip install --dry-run --ignore-installed --report dependency-report.json .
          python -c "import json; from packaging.utils import canonicalize_name; report=json.load(open('dependency-report.json', encoding='utf-8')); [print(f\"{item['metadata']['name']}=={item['metadata']['version']}\") for item in report['install'] if canonicalize_name(item['metadata']['name']) != 'sanctum-suite']" > requirements-audit.txt
          pip-audit --requirement requirements-audit.txt --format json --output pip-audit-report.json || audit_status=$?
          if [ "$bandit_status" -ne 0 ] || [ "$audit_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  property-fuzz:
    name: Property-based parser fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run bounded generative tests
        run: python -m pytest -q src/sanctum_suite/tests/test_property_based.py

  dast:
    name: Local application DAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Start local API for scanning
        env:
          SANCTUM_API_KEY: ci-only-dast-key-not-a-secret-value-0123456789
        run: |
          python -m uvicorn sanctum_suite.api.server:app --host 0.0.0.0 --port 8000 > /tmp/sanctum-dast.log 2>&1 &
          echo $! > /tmp/sanctum-dast.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sanctum-dast.log
          exit 1
      - name: Run OWASP ZAP baseline scan against local API documentation surface
        run: |
          docker run --network host --rm \
            --volume "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000/docs -m 3 -T 60 -J /zap/wrk/zap-report.json -I
      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: zap-report.json
          if-no-files-found: ignore
          retention-days: 30

  container-security:
    name: Container vulnerability scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build local image
        run: docker build --tag sanctum-suite:ci .
      - name: Scan image and generate SBOM
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: sanctum-suite:ci
          scan-type: image
          format: cyclonedx
          output: sanctum-image-sbom.cdx.json
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: sanctum-image-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30
