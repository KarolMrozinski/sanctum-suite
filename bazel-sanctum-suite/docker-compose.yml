version: '3.8'

services:
  sanctum-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanctum-suite-core
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SANCTUM_ENVIRONMENT: production
      SANCTUM_API_KEY: ${SANCTUM_API_KEY:?Set SANCTUM_API_KEY in the deployment secret store}
      SANCTUM_OPA_URL: ${SANCTUM_OPA_URL:?Set SANCTUM_OPA_URL to the trusted HTTPS OPA endpoint}
      SANCTUM_OPA_BEARER_TOKEN_FILE: ${SANCTUM_OPA_BEARER_TOKEN_FILE:-}
      SANCTUM_OPA_CA_CERT: ${SANCTUM_OPA_CA_CERT:-}
      SANCTUM_TPM_VERIFIER_URL: ${SANCTUM_TPM_VERIFIER_URL:?Set SANCTUM_TPM_VERIFIER_URL to the trusted HTTPS Keylime verifier}
      SANCTUM_TPM_AGENT_ID: ${SANCTUM_TPM_AGENT_ID:?Set SANCTUM_TPM_AGENT_ID to the registered Keylime agent UUID}
      SANCTUM_TPM_CA_CERT_FILE: /run/secrets/keylime-verifier-ca.pem
      SANCTUM_TPM_CLIENT_CERT_FILE: /run/secrets/keylime-client-cert.pem
      SANCTUM_TPM_CLIENT_KEY_FILE: /run/secrets/keylime-client-key.pem
      SANCTUM_TPM_MAX_ATTESTATION_AGE_SECONDS: ${SANCTUM_TPM_MAX_ATTESTATION_AGE_SECONDS:-120}
      SANCTUM_TEE_VERIFIER_URL: ${SANCTUM_TEE_VERIFIER_URL:?Set SANCTUM_TEE_VERIFIER_URL to the trusted HTTPS Trustee claims gateway}
      SANCTUM_TEE_WORKLOAD_ID: ${SANCTUM_TEE_WORKLOAD_ID:?Set SANCTUM_TEE_WORKLOAD_ID to the approved workload identifier}
      SANCTUM_TEE_CA_CERT_FILE: /run/secrets/trustee-verifier-ca.pem
      SANCTUM_TEE_CLIENT_CERT_FILE: /run/secrets/trustee-client-cert.pem
      SANCTUM_TEE_CLIENT_KEY_FILE: /run/secrets/trustee-client-key.pem
      SANCTUM_TEE_EXPECTED_CLAIMS_FILE: /run/secrets/tee-expected-claims.json
      SANCTUM_TEE_MAX_ATTESTATION_AGE_SECONDS: ${SANCTUM_TEE_MAX_ATTESTATION_AGE_SECONDS:-120}
      SANCTUM_AUTHORIZED_TARGETS: ${SANCTUM_AUTHORIZED_TARGETS:-}
      SANCTUM_LICENSE_KEY: ${SANCTUM_LICENSE_KEY:-}
      SANCTUM_LICENSE_PUBLIC_KEY: ${SANCTUM_LICENSE_PUBLIC_KEY:-}
      SANCTUM_SIEM_WEBHOOK_URL: ${SANCTUM_SIEM_WEBHOOK_URL:-}
      SANCTUM_SIEM_WEBHOOK_TOKEN: ${SANCTUM_SIEM_WEBHOOK_TOKEN:-}
      SANCTUM_SYSLOG_HOST: ${SANCTUM_SYSLOG_HOST:-}
      SANCTUM_SYSLOG_PORT: ${SANCTUM_SYSLOG_PORT:-514}
      SANCTUM_SYSLOG_PROTOCOL: ${SANCTUM_SYSLOG_PROTOCOL:-udp}
      SANCTUM_KUBERNETES_WEBHOOK_SECRET: ${SANCTUM_KUBERNETES_WEBHOOK_SECRET:-}
      SANCTUM_KUBERNETES_WEBHOOK_ALLOWED_GATES: ${SANCTUM_KUBERNETES_WEBHOOK_ALLOWED_GATES:-}
      SANCTUM_KMS_BACKEND: ${SANCTUM_KMS_BACKEND:-local-ephemeral}
      SANCTUM_VAULT_ADDR: ${SANCTUM_VAULT_ADDR:-}
      SANCTUM_VAULT_TOKEN: ${SANCTUM_VAULT_TOKEN:-}
      SANCTUM_VAULT_TOKEN_FILE: ${SANCTUM_VAULT_TOKEN_FILE:-}
      SANCTUM_VAULT_TRANSIT_MOUNT: ${SANCTUM_VAULT_TRANSIT_MOUNT:-transit}
      SANCTUM_VAULT_TRANSIT_KEY: ${SANCTUM_VAULT_TRANSIT_KEY:-}
      SANCTUM_VAULT_NAMESPACE: ${SANCTUM_VAULT_NAMESPACE:-}
      SANCTUM_VAULT_CA_CERT: ${SANCTUM_VAULT_CA_CERT:-}
      SANCTUM_OIDC_ISSUER: ${SANCTUM_OIDC_ISSUER:-}
      SANCTUM_OIDC_AUDIENCE: ${SANCTUM_OIDC_AUDIENCE:-}
      SANCTUM_OIDC_CA_CERT: ${SANCTUM_OIDC_CA_CERT:-}
      SANCTUM_SAML_METADATA_URL: ${SANCTUM_SAML_METADATA_URL:-}
      SANCTUM_KAFKA_BOOTSTRAP_SERVERS: ${SANCTUM_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SANCTUM_DEBEZIUM_CONNECT_URL: ${SANCTUM_DEBEZIUM_CONNECT_URL:-http://debezium-connect:8083}
      SANCTUM_DEBEZIUM_DB_HOST: ${SANCTUM_DEBEZIUM_DB_HOST:-postgres}
      SANCTUM_DEBEZIUM_DB_NAME: ${SANCTUM_DEBEZIUM_DB_NAME:-sanctum}
      SANCTUM_DEBEZIUM_TOPIC_PREFIX: ${SANCTUM_DEBEZIUM_TOPIC_PREFIX:-sanctum}
      SANCTUM_CONTROLS_DB: /data/controls.sqlite3
      SANCTUM_BILLING_DB: /data/usage.sqlite3
    volumes:
      - sanctum_data:/data
    secrets:
      - keylime-verifier-ca
      - keylime-client-cert
      - keylime-client-key
      - trustee-verifier-ca
      - trustee-client-cert
      - trustee-client-key
      - tee-expected-claims
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sanctum-net

  # DODANY MODUŁ DASHBOARDU (pobierany bezpośrednio z GHCR)
  vault:
    image: hashicorp/vault:1.17
    profiles: ["enterprise"]
    container_name: sanctum-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    networks:
      - sanctum-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.4
    profiles: ["enterprise"]
    container_name: sanctum-keycloak
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${SANCTUM_KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${SANCTUM_KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    networks:
      - sanctum-net

  postgres:
    image: postgres:16
    profiles: ["enterprise"]
    container_name: sanctum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SANCTUM_DEBEZIUM_DB_NAME:-sanctum}
      POSTGRES_USER: sanctum
      POSTGRES_PASSWORD: sanctum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sanctum-net

  zookeeper:
    image: bitnami/zookeeper:3.9
    profiles: ["enterprise"]
    container_name: sanctum-zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "127.0.0.1:2181:2181"
    networks:
      - sanctum-net

  kafka:
    image: bitnami/kafka:3.9
    profiles: ["enterprise"]
    container_name: sanctum-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    networks:
      - sanctum-net

  debezium-connect:
    image: quay.io/debezium/connect:2.7
    profiles: ["enterprise"]
    container_name: sanctum-debezium
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: ${SANCTUM_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      GROUP_ID: sanctum-connect
      CONFIG_STORAGE_TOPIC: sanctum_connect_configs
      OFFSET_STORAGE_TOPIC: sanctum_connect_offsets
      STATUS_STORAGE_TOPIC: sanctum_connect_statuses
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium-connect
    networks:
      - sanctum-net

volumes:
  postgres_data:
  sanctum_data:

networks:
  sanctum-net:
    driver: bridge

secrets:
  keylime-verifier-ca:
    file: ${SANCTUM_TPM_VERIFIER_CA_SOURCE:?Set SANCTUM_TPM_VERIFIER_CA_SOURCE to the trusted CA bundle}
  keylime-client-cert:
    file: ${SANCTUM_TPM_CLIENT_CERT_SOURCE:?Set SANCTUM_TPM_CLIENT_CERT_SOURCE to the Keylime client certificate}
  keylime-client-key:
    file: ${SANCTUM_TPM_CLIENT_KEY_SOURCE:?Set SANCTUM_TPM_CLIENT_KEY_SOURCE to the protected Keylime client private key}
  trustee-verifier-ca:
    file: ${SANCTUM_TEE_VERIFIER_CA_SOURCE:?Set SANCTUM_TEE_VERIFIER_CA_SOURCE to the trusted Trustee gateway CA bundle}
  trustee-client-cert:
    file: ${SANCTUM_TEE_CLIENT_CERT_SOURCE:?Set SANCTUM_TEE_CLIENT_CERT_SOURCE to the Trustee gateway client certificate}
  trustee-client-key:
    file: ${SANCTUM_TEE_CLIENT_KEY_SOURCE:?Set SANCTUM_TEE_CLIENT_KEY_SOURCE to the protected Trustee gateway private key}
  tee-expected-claims:
    file: ${SANCTUM_TEE_EXPECTED_CLAIMS_SOURCE:?Set SANCTUM_TEE_EXPECTED_CLAIMS_SOURCE to the approved SNP/TDX claims allowlist}