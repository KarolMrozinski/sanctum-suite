apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sanctum
  namespace: argocd
spec:
  description: SANCTUM multi-phase rollout project
  sourceRepos:
    - 'https://github.com/KarolMrozinski/sanctum-suite.git'
  destinations:
    - namespace: sanctum-phase1
      server: https://kubernetes.default.svc
    - namespace: sanctum-phase2
      server: https://kubernetes.default.svc
    - namespace: sanctum-phase3
      server: https://kubernetes.default.svc
    - namespace: sanctum-phase4
      server: https://kubernetes.default.svc
    - namespace: sanctum-phase5
      server: https://kubernetes.default.svc
    - namespace: sanctum-phase6
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: 'apps'
      kind: Deployment
    - group: 'batch'
      kind: Job
    - group: 'networking.k8s.io'
      kind: NetworkPolicy
    - group: 'rbac.authorization.k8s.io'
      kind: Role
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
