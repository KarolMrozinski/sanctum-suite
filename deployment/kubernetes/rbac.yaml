apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sanctum-phase1-reader
  namespace: sanctum-phase1
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sanctum-phase1-binding
  namespace: sanctum-phase1
subjects:
  - kind: ServiceAccount
    name: sanctum-phase1-sa
    namespace: sanctum-phase1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sanctum-phase1-reader
