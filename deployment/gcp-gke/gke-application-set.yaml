apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sanctum-suite-gke-prod
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - phase: phase1
            namespace: sanctum-phase1
          - phase: phase2
            namespace: sanctum-phase2
  template:
    metadata:
      name: '{{.phase}}'
    spec:
      project: sanctum
      source:
        repoURL: https://github.com/KarolMrozinski/sanctum-suite.git
        targetRevision: main
        path: helm/sanctum-suite-phases
        helm:
          parameters:
            - name: phaseName
              value: '{{.phase}}'
      destination:
        server: https://<GKE_CLUSTER_ENDPOINT>
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
