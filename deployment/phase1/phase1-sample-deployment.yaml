apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanctum-suite-phase1
  namespace: sanctum-phase1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanctum-suite-phase1
  template:
    metadata:
      labels:
        app: sanctum-suite-phase1
    spec:
      serviceAccountName: sanctum-phase1-sa
      containers:
        - name: sanctum-suite
          image: ghcr.io/karolmrozinski/sanctum-suite:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sanctum-phase1-config
            - secretRef:
                name: sanctum-phase1-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
