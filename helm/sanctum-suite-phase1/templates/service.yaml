apiVersion: v1
kind: Service
metadata:
  name: sanctum-live-ready
  namespace: {{ .Values.namespace.name }}
spec:
  selector:
    app: sanctum-live-ready
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
