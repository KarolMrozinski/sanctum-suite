{{- if .Values.validation.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: sanctum-live-ready-validation
  namespace: {{ .Values.namespace.name }}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: validation
          image: {{ .Values.validation.image.repository }}:{{ .Values.validation.image.tag }}
          imagePullPolicy: {{ .Values.validation.image.pullPolicy }}
          command: ["/bin/sh", "-lc"]
          args:
            - |
              python -m sanctum_suite.api.server --help >/dev/null 2>&1 || true;
              echo "Phase 1 validation job started";
              echo "Check GCP, ELK, Terraform and Kafka connectivity before promoting to READY";
          envFrom:
            - configMapRef:
                name: sanctum-live-ready-config
            - secretRef:
                name: sanctum-live-ready-secrets
          resources:
            requests:
              cpu: {{ .Values.validation.resources.requests.cpu | quote }}
              memory: {{ .Values.validation.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.validation.resources.limits.cpu | quote }}
              memory: {{ .Values.validation.resources.limits.memory | quote }}
{{- end }}
