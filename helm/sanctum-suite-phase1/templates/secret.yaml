apiVersion: v1
kind: Secret
metadata:
  name: sanctum-live-ready-secrets
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sanctum-live-ready-certs
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  elk-ca.pem: |
    {{ .Values.certs.elkCa | nindent 4 }}
  terraform-ca.pem: |
    {{ .Values.certs.terraformCa | nindent 4 }}
  kafka-ca.pem: |
    {{ .Values.certs.kafkaCa | nindent 4 }}
