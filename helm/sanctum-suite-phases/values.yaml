phaseName: phase1

deployAllPhases: false

phases:
  phase1:
    enabled: true
    namespace: sanctum-phase1
    serviceAccountName: sanctum-phase1
    image:
      repository: ghcr.io/karolmrozinski/sanctum-suite
      tag: latest
      pullPolicy: IfNotPresent
    config:
      SANCTUM_ENVIRONMENT: prod
      SANCTUM_AUTHORIZED_TARGETS: "elk.internal.example:9200,gcp.googleapis.com:443,app.terraform.io:443,kafka-1:9092,kafka-2:9092"
      SANCTUM_GCP_PROJECT_ID: prod-platform
      SANCTUM_GCP_REGION: us-central1
      SANCTUM_GCP_SERVICE_ACCOUNT: svc-sanctum-audit
      SANCTUM_GCP_API_SCOPE: cloud-platform
      SANCTUM_ELK_ENDPOINT: https://elk.internal.example:9200
      SANCTUM_ELK_INDEX_PATTERN: sanctum-*
      SANCTUM_ELK_TLS_VERIFY: "true"
      SANCTUM_TERRAFORM_API_URL: https://app.terraform.io/api/v2
      SANCTUM_TERRAFORM_ORG: platform-org
      SANCTUM_TERRAFORM_WORKSPACE: prod
      SANCTUM_TERRAFORM_STATE_PATH: /var/lib/sanctum/terraform/terraform.tfstate
      SANCTUM_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092"
      SANCTUM_KAFKA_TOPIC: sanctum.events
      SANCTUM_KAFKA_SECURITY_PROTOCOL: SASL_SSL
      SANCTUM_KAFKA_SASL_MECHANISM: PLAIN
    secrets:
      SANCTUM_API_KEY: replace-with-real-api-key
      SANCTUM_GCP_SERVICE_ACCOUNT_JSON: '{"type":"service_account","project_id":"prod-platform","private_key_id":"replace-me","private_key":"-----BEGIN PRIVATE KEY-----\nREPLACE\n-----END PRIVATE KEY-----\n","client_email":"svc-sanctum-audit@prod-platform.iam.gserviceaccount.com","client_id":"replace-me","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/svc-sanctum-audit%40prod-platform.iam.gserviceaccount.com"}'
      SANCTUM_ELK_API_KEY: replace-with-real-elk-api-key
      SANCTUM_TERRAFORM_TOKEN: replace-with-real-terraform-token
      SANCTUM_KAFKA_USERNAME: sanctum-producer
      SANCTUM_KAFKA_PASSWORD: replace-with-real-kafka-password
    certs:
      elkCa: |
        -----BEGIN CERTIFICATE-----
        REPLACE_WITH_REAL_ELK_CA_CERT
        -----END CERTIFICATE-----
      terraformCa: |
        -----BEGIN CERTIFICATE-----
        REPLACE_WITH_REAL_TERRAFORM_CA_CERT
        -----END CERTIFICATE-----
      kafkaCa: |
        -----BEGIN CERTIFICATE-----
        REPLACE_WITH_REAL_KAFKA_CA_CERT
        -----END CERTIFICATE-----
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    readinessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 20
  phase2:
    enabled: true
    namespace: sanctum-phase2
    serviceAccountName: sanctum-phase2
    image:
      repository: ghcr.io/karolmrozinski/sanctum-suite
      tag: latest
      pullPolicy: IfNotPresent
    config:
      SANCTUM_ENVIRONMENT: prod
      SANCTUM_BAM_METADATA_PATH: /var/lib/sanctum/bam/metadata.json
      SANCTUM_HIRS_API_URL: https://hirs.internal.example/api
      SANCTUM_PACCOR_CERT_SUBJECT: CN=sanctum-edge-prod,O=Sanctum
      SANCTUM_PACCOR_API_URL: https://paccor.internal.example/api
      SANCTUM_RIM_MANIFEST_PATH: /var/lib/sanctum/rim/manifest.json
      SANCTUM_RIM_API_URL: https://rim.internal.example/api
    secrets:
      SANCTUM_BAM_API_TOKEN: replace-with-real-bam-token
      SANCTUM_HIRS_API_TOKEN: replace-with-real-hirs-token
      SANCTUM_PACCOR_TOKEN: replace-with-real-paccor-token
      SANCTUM_RIM_TOKEN: replace-with-real-rim-token
    certs:
      elkCa: |
        -----BEGIN CERTIFICATE-----
        REPLACE_WITH_REAL_BAM_CA_CERT
        -----END CERTIFICATE-----
      terraformCa: |
        -----BEGIN CERTIFICATE-----
        REPLACE_WITH_REAL_HIRS_CA_CERT
        -----END CERTIFICATE-----
      kafkaCa: |
        -----BEGIN CERTIFICATE-----
        REPLACE_WITH_REAL_RIM_CA_CERT
        -----END CERTIFICATE-----
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 800m
        memory: 768Mi
    readinessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 20
  phase3:
    enabled: true
    namespace: sanctum-phase3
    serviceAccountName: sanctum-phase3
    image:
      repository: ghcr.io/karolmrozinski/sanctum-suite
      tag: latest
      pullPolicy: IfNotPresent
    config:
      SANCTUM_ENVIRONMENT: prod
      SANCTUM_HOST_INVENTORY_URL: https://inventory.internal.example/api/hosts
      SANCTUM_OS_FAMILY: solaris
      SANCTUM_VXWORKS_API_URL: https://vxworks.internal.example/api
      SANCTUM_GNN_MODEL_REGISTRY: https://gnn-registry.internal.example/models
      SANCTUM_AGENT_RUNTIME: https://agent-runtime.internal.example
      SANCTUM_QKD_PEER_ID: peer-alpha
      SANCTUM_QKD_KME_URL: https://qkd.internal.example/kme
      SANCTUM_NEUROMORPHIC_ACCELERATOR: loihi
    secrets:
      SANCTUM_HOST_API_TOKEN: replace-with-real-host-inventory-token
      SANCTUM_VXWORKS_TOKEN: replace-with-real-vxworks-token
      SANCTUM_MODEL_API_TOKEN: replace-with-real-model-registry-token
      SANCTUM_AGENT_TOKEN: replace-with-real-agent-runtime-token
      SANCTUM_QKD_TOKEN: replace-with-real-qkd-token
      SANCTUM_NEUROMORPHIC_TOKEN: replace-with-real-neuromorphic-token
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 800m
        memory: 768Mi
    readinessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 20
  phase4:
    enabled: true
    namespace: sanctum-phase4
    serviceAccountName: sanctum-phase4
    image:
      repository: ghcr.io/karolmrozinski/sanctum-suite
      tag: latest
      pullPolicy: IfNotPresent
    config:
      SANCTUM_ENVIRONMENT: prod
      SANCTUM_XKEYSCORE_API_URL: https://xkeyscore.internal.example/api
      SANCTUM_BOUNDLESS_API_URL: https://boundless.internal.example/api
      SANCTUM_MISSION_API_URL: https://mission.internal.example/api
      SANCTUM_SEC_PALM_MODEL_REGISTRY: https://sec-palm.internal.example/models
      SANCTUM_MODEL_REGISTRY_URL: https://sec-palm.internal.example/models
      SANCTUM_PALANTIR_FOUNDRY_API_URL: https://foundry.internal.example/api
      SANCTUM_DATA_FUSION_URL: https://foundry.internal.example/api
    secrets:
      SANCTUM_XKEYSCORE_TOKEN: replace-with-real-xkeyscore-token
      SANCTUM_BOUNDLESS_TOKEN: replace-with-real-boundless-token
      SANCTUM_MISSION_API_TOKEN: replace-with-real-mission-token
      SANCTUM_MODEL_GOVERNANCE_TOKEN: replace-with-real-model-governance-token
      SANCTUM_DATA_FUSION_TOKEN: replace-with-real-data-fusion-token
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 800m
        memory: 768Mi
    readinessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 20
  phase5:
    enabled: true
    namespace: sanctum-phase5
    serviceAccountName: sanctum-phase5
    image:
      repository: ghcr.io/karolmrozinski/sanctum-suite
      tag: latest
      pullPolicy: IfNotPresent
    config:
      SANCTUM_ENVIRONMENT: prod
      SANCTUM_RETENTION_POLICY_DB: /var/lib/sanctum/retention/retention.sqlite3
      SANCTUM_AUDIT_LOG_STORE_URL: https://audit.internal.example/api/logs
      SANCTUM_COMPLIANCE_FRAMEWORK: NIST-800-53
      SANCTUM_COMPLIANCE_API_URL: https://compliance.internal.example/api
    secrets:
      SANCTUM_AUDIT_LOG_TOKEN: replace-with-real-audit-token
      SANCTUM_COMPLIANCE_TOKEN: replace-with-real-compliance-token
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 800m
        memory: 768Mi
    readinessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 20
  phase6:
    enabled: true
    namespace: sanctum-phase6
    serviceAccountName: sanctum-phase6
    image:
      repository: ghcr.io/karolmrozinski/sanctum-suite
      tag: latest
      pullPolicy: IfNotPresent
    config:
      SANCTUM_ENVIRONMENT: prod
      SANCTUM_COMPLIANCE_FRAMEWORK: NIST-800-53
      SANCTUM_COMPLIANCE_API_URL: https://compliance.internal.example/api
      SANCTUM_AUDIT_LOG_STORE_URL: https://audit.internal.example/api/logs
    secrets:
      SANCTUM_COMPLIANCE_TOKEN: replace-with-real-compliance-token
      SANCTUM_AUDIT_LOG_TOKEN: replace-with-real-audit-token
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 800m
        memory: 768Mi
    readinessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      path: /healthz
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 20
