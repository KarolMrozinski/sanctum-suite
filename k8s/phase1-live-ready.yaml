apiVersion: v1
kind: Namespace
metadata:
  name: sanctum
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sanctum-live-ready
  namespace: sanctum
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sanctum-live-ready-config
  namespace: sanctum
data:
  SANCTUM_ENVIRONMENT: "prod"
  SANCTUM_AUTHORIZED_TARGETS: "elk.internal.example:9200,gcp.googleapis.com:443,app.terraform.io:443,kafka-1:9092,kafka-2:9092"
  SANCTUM_GCP_PROJECT_ID: "prod-platform"
  SANCTUM_GCP_REGION: "us-central1"
  SANCTUM_GCP_SERVICE_ACCOUNT: "svc-sanctum-audit"
  SANCTUM_GCP_API_SCOPE: "cloud-platform"
  SANCTUM_ELK_ENDPOINT: "https://elk.internal.example:9200"
  SANCTUM_ELK_INDEX_PATTERN: "sanctum-*"
  SANCTUM_ELK_TLS_VERIFY: "true"
  SANCTUM_TERRAFORM_API_URL: "https://app.terraform.io/api/v2"
  SANCTUM_TERRAFORM_ORG: "platform-org"
  SANCTUM_TERRAFORM_WORKSPACE: "prod"
  SANCTUM_TERRAFORM_STATE_PATH: "/var/lib/sanctum/terraform/terraform.tfstate"
  SANCTUM_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092"
  SANCTUM_KAFKA_TOPIC: "sanctum.events"
  SANCTUM_KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  SANCTUM_KAFKA_SASL_MECHANISM: "PLAIN"
---
apiVersion: v1
kind: Secret
metadata:
  name: sanctum-live-ready-secrets
  namespace: sanctum
type: Opaque
stringData:
  SANCTUM_API_KEY: "replace-with-real-api-key"
  SANCTUM_GCP_SERVICE_ACCOUNT_JSON: '{"type":"service_account","project_id":"prod-platform","private_key_id":"replace-me","private_key":"-----BEGIN PRIVATE KEY-----\nREPLACE\n-----END PRIVATE KEY-----\n","client_email":"svc-sanctum-audit@prod-platform.iam.gserviceaccount.com","client_id":"replace-me","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/svc-sanctum-audit%40prod-platform.iam.gserviceaccount.com"}'
  SANCTUM_ELK_API_KEY: "replace-with-real-elk-api-key"
  SANCTUM_ELK_USERNAME: "sanctum-agent"
  SANCTUM_ELK_PASSWORD: "replace-with-real-password"
  SANCTUM_TERRAFORM_TOKEN: "replace-with-real-terraform-token"
  SANCTUM_KAFKA_USERNAME: "sanctum-producer"
  SANCTUM_KAFKA_PASSWORD: "replace-with-real-kafka-password"
  SANCTUM_GCP_KMS_KEYRING: "sanctum-kms"
  SANCTUM_GCP_KMS_KEY: "sanctum-signing-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: sanctum-live-ready-certs
  namespace: sanctum
type: Opaque
stringData:
  elk-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_ELK_CA_CERT
    -----END CERTIFICATE-----
  terraform-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_TERRAFORM_CA_CERT
    -----END CERTIFICATE-----
  kafka-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_KAFKA_CA_CERT
    -----END CERTIFICATE-----
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sanctum-live-ready-role
  namespace: sanctum
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sanctum-live-ready-binding
  namespace: sanctum
subjects:
  - kind: ServiceAccount
    name: sanctum-live-ready
    namespace: sanctum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sanctum-live-ready-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanctum-live-ready
  namespace: sanctum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanctum-live-ready
  template:
    metadata:
      labels:
        app: sanctum-live-ready
    spec:
      serviceAccountName: sanctum-live-ready
      containers:
        - name: sanctum
          image: ghcr.io/karolmrozinski/sanctum-suite:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sanctum-live-ready-config
            - secretRef:
                name: sanctum-live-ready-secrets
          env:
            - name: SANCTUM_ELK_CA_CERT
              value: /etc/sanctum/certs/elk-ca.pem
            - name: SANCTUM_TERRAFORM_CA_CERT
              value: /etc/sanctum/certs/terraform-ca.pem
            - name: SANCTUM_KAFKA_SSL_CA_LOCATION
              value: /etc/sanctum/certs/kafka-ca.pem
          volumeMounts:
            - name: certs
              mountPath: /etc/sanctum/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: certs
          secret:
            secretName: sanctum-live-ready-certs
---
apiVersion: v1
kind: Service
metadata:
  name: sanctum-live-ready
  namespace: sanctum
spec:
  selector:
    app: sanctum-live-ready
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sanctum-live-ready-egress
  namespace: sanctum
spec:
  podSelector:
    matchLabels:
      app: sanctum-live-ready
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
    - to:
        - ipBlock:
            cidr: 172.16.0.0/12
    - to:
        - ipBlock:
            cidr: 192.168.0.0/16
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: kafka
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: elasticsearch
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sanctum-live-ready-validation
  namespace: sanctum
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: validation
          image: ghcr.io/karolmrozinski/sanctum-suite:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - |
              python -m sanctum_suite.api.server --help >/dev/null 2>&1 || true;
              echo "Phase 1 validation job started";
              echo "Check GCP, ELK, Terraform and Kafka connectivity before promoting to READY";
          envFrom:
            - configMapRef:
                name: sanctum-live-ready-config
            - secretRef:
                name: sanctum-live-ready-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
